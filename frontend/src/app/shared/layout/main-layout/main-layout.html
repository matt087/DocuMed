<div class="flex min-h-screen bg-slate-50">
  <aside
    class="bg-slate-800 text-slate-100 flex flex-col fixed h-screen transition-all duration-200 z-10 overflow-hidden"
    [class.w-64]="!colapsado()"
    [class.w-20]="colapsado()"
  >
    <div
      class="px-4 py-6 border-b border-slate-700 flex items-center"
      [class.justify-between]="!colapsado()"
      [class.justify-center]="colapsado()"
    >
      <div
        class="overflow-hidden transition-all duration-200"
        [class.max-w-[9999px]]="!colapsado()"
        [class.opacity-100]="!colapsado()"
        [class.max-w-0]="colapsado()"
        [class.opacity-0]="colapsado()"
      >
        <h1 class="text-2xl font-bold text-white whitespace-nowrap">DocuMed</h1>
      </div>
      <button
        (click)="alternarColapso()"
        class="text-slate-400 hover:text-white p-2 rounded-lg hover:bg-slate-700 transition-colors flex-shrink-0"
        [title]="colapsado() ? 'Expandir menú' : 'Colapsar menú'"
      >
        @if (colapsado()) {
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
          </svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
          </svg>
        }
      </button>
    </div>

    <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto overflow-x-hidden">
      <a
        routerLink="/pacientes"
        routerLinkActive="bg-slate-700 text-white"
        [routerLinkActiveOptions]="{ exact: false }"
        class="flex items-center py-3 rounded-lg text-base font-medium text-slate-300 hover:bg-slate-700 hover:text-white transition-colors"
        [class.gap-3]="!colapsado()"
        [class.px-3]="!colapsado()"
        [class.justify-center]="colapsado()"
        [title]="colapsado() ? 'Pacientes' : ''"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M22 21v-2a4 4 0 00-3-3.87" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M16 3.13a4 4 0 010 7.75" />
        </svg>
        <span
          class="overflow-hidden whitespace-nowrap transition-all duration-200"
          [class.max-w-[9999px]]="!colapsado()"
          [class.opacity-100]="!colapsado()"
          [class.max-w-0]="colapsado()"
          [class.opacity-0]="colapsado()"
        >
          Pacientes
        </span>
      </a>

      <a
        routerLink="/consultas"
        routerLinkActive="bg-slate-700 text-white"
        [routerLinkActiveOptions]="{ exact: false }"
        class="flex items-center py-3 rounded-lg text-base font-medium text-slate-300 hover:bg-slate-700 hover:text-white transition-colors"
        [class.gap-3]="!colapsado()"
        [class.px-3]="!colapsado()"
        [class.justify-center]="colapsado()"
        [title]="colapsado() ? 'Consultas' : ''"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2" />
          <rect x="9" y="3" width="6" height="4" rx="1" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 13h6M9 17h4" />
        </svg>
        <span
          class="overflow-hidden whitespace-nowrap transition-all duration-200"
          [class.max-w-[9999px]]="!colapsado()"
          [class.opacity-100]="!colapsado()"
          [class.max-w-0]="colapsado()"
          [class.opacity-0]="colapsado()"
        >
          Consultas
        </span>
      </a>
    </nav>

    <div class="border-t border-slate-700 px-3 py-4 space-y-1">
      <button
        class="flex items-center py-3 rounded-lg text-base font-medium text-slate-300 hover:bg-slate-700 hover:text-white transition-colors w-full"
        routerLink="/configuracion"
        [class.gap-3]="!colapsado()"
        [class.px-3]="!colapsado()"
        [class.justify-center]="colapsado()"
        [title]="colapsado() ? 'Configuración' : ''"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33h0a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51h0a1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82v0a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z" />
        </svg>
        <span
          class="overflow-hidden whitespace-nowrap transition-all duration-200"
          [class.max-w-[9999px]]="!colapsado()"
          [class.opacity-100]="!colapsado()"
          [class.max-w-0]="colapsado()"
          [class.opacity-0]="colapsado()"
        >
          Configuración
        </span>
      </button>

      <button
        (click)="cerrarAplicacion()"
        class="flex items-center py-3 rounded-lg text-base font-medium text-red-400 hover:bg-red-900/40 hover:text-red-300 transition-colors w-full"
        [class.gap-3]="!colapsado()"
        [class.px-3]="!colapsado()"
        [class.justify-center]="colapsado()"
        [title]="colapsado() ? 'Cerrar aplicación' : ''"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M18.36 6.64a9 9 0 11-12.73 0" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 2v10" />
        </svg>
        <span
          class="overflow-hidden whitespace-nowrap transition-all duration-200"
          [class.max-w-[9999px]]="!colapsado()"
          [class.opacity-100]="!colapsado()"
          [class.max-w-0]="colapsado()"
          [class.opacity-0]="colapsado()"
        >
          Cerrar aplicación
        </span>
      </button>
    </div>
  </aside>

  <main
    class="flex-1 transition-all duration-200"
    [class.ml-64]="!colapsado()"
    [class.ml-20]="colapsado()"
  >
    <router-outlet />
  </main>

</div>
