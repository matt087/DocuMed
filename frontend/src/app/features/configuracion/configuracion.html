<div class="min-h-screen bg-slate-50 dark:bg-slate-950 p-8 transition-colors">
  <div class="max-w-4xl mx-auto">

    <div class="mb-6">
      <h1 class="text-2xl font-semibold text-slate-900 dark:text-white">Configuración</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Preferencias de la aplicación</p>
    </div>

    <div class="flex gap-6">

      <nav class="w-48 flex-shrink-0 space-y-1">
        <button
          (click)="seleccionarPestana('apariencia')"
          class="w-full text-left px-3 py-2.5 rounded-lg text-sm font-medium transition-colors"
          [class.bg-blue-50]="pestanaActiva() === 'apariencia'"
          [class.text-blue-700]="pestanaActiva() === 'apariencia'"
          [class.dark:bg-blue-950]="pestanaActiva() === 'apariencia'"
          [class.dark:text-blue-300]="pestanaActiva() === 'apariencia'"
          [class.text-slate-600]="pestanaActiva() !== 'apariencia'"
          [class.dark:text-slate-400]="pestanaActiva() !== 'apariencia'"
        >
          Apariencia
        </button>
        <button
          (click)="seleccionarPestana('almacenamiento')"
          class="w-full text-left px-3 py-2.5 rounded-lg text-sm font-medium transition-colors"
          [class.bg-blue-50]="pestanaActiva() === 'almacenamiento'"
          [class.text-blue-700]="pestanaActiva() === 'almacenamiento'"
          [class.dark:bg-blue-950]="pestanaActiva() === 'almacenamiento'"
          [class.dark:text-blue-300]="pestanaActiva() === 'almacenamiento'"
          [class.text-slate-600]="pestanaActiva() !== 'almacenamiento'"
          [class.dark:text-slate-400]="pestanaActiva() !== 'almacenamiento'"
        >
          Almacenamiento
        </button>
        <button
          (click)="seleccionarPestana('respaldo')"
          class="w-full text-left px-3 py-2.5 rounded-lg text-sm font-medium transition-colors"
          [class.bg-blue-50]="pestanaActiva() === 'respaldo'"
          [class.text-blue-700]="pestanaActiva() === 'respaldo'"
          [class.dark:bg-blue-950]="pestanaActiva() === 'respaldo'"
          [class.dark:text-blue-300]="pestanaActiva() === 'respaldo'"
          [class.text-slate-600]="pestanaActiva() !== 'respaldo'"
          [class.dark:text-slate-400]="pestanaActiva() !== 'respaldo'"
        >
          Respaldo
        </button>
      </nav>

      <div class="flex-1 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-6 transition-colors">

        @if (pestanaActiva() === 'apariencia') {
          <h2 class="text-sm font-semibold text-slate-900 dark:text-white mb-1">Tema de la aplicación</h2>
          <p class="text-sm text-slate-500 dark:text-slate-400 mb-5">Elige cómo se ve DocuMed en tu pantalla.</p>

          <div class="flex gap-4">
            <button
              (click)="themeService.establecer('claro')"
              class="flex-1 border-2 rounded-xl p-4 transition-colors"
              [class.border-blue-500]="themeService.tema() === 'claro'"
              [class.border-slate-200]="themeService.tema() !== 'claro'"
              [class.dark:border-slate-700]="themeService.tema() !== 'claro'"
            >
              <div class="h-20 rounded-lg bg-slate-50 border border-slate-200 mb-3 flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-amber-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="5" />
                  <path stroke-linecap="round" d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
                </svg>
              </div>
              <p class="text-sm font-medium text-slate-900 dark:text-white">Claro</p>
            </button>

            <button
              (click)="themeService.establecer('oscuro')"
              class="flex-1 border-2 rounded-xl p-4 transition-colors"
              [class.border-blue-500]="themeService.tema() === 'oscuro'"
              [class.border-slate-200]="themeService.tema() !== 'oscuro'"
              [class.dark:border-slate-700]="themeService.tema() !== 'oscuro'"
            >
              <div class="h-20 rounded-lg bg-slate-900 border border-slate-700 mb-3 flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-slate-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
                </svg>
              </div>
              <p class="text-sm font-medium text-slate-900 dark:text-white">Oscuro</p>
            </button>
          </div>
        }

        @if (pestanaActiva() === 'almacenamiento') {
          <div class="text-center py-12">
            <p class="text-slate-400 dark:text-slate-500 text-sm">Próximamente.</p>
          </div>
        }

        @if (pestanaActiva() === 'respaldo') {
          <div class="text-center py-12">
            <p class="text-slate-400 dark:text-slate-500 text-sm">Próximamente.</p>
          </div>
        }

      </div>
    </div>
  </div>
</div>
